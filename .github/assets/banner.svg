<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14100b"/>
      <stop offset="1" stop-color="#1d150c"/>
    </linearGradient>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/></marker>
    <marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6b5a48"/></marker>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>

  <text x="64" y="104" fill="#f5ede3" font-size="56" font-weight="700" letter-spacing="-1">dsh-llm-ollama-native</text>
  <text x="66" y="148" fill="#c8b59c" font-size="23">Make <tspan fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">reasoningEffort</tspan> actually work on local Ollama models.</text>

  <!-- left node -->
  <g font-size="18" font-weight="600">
    <rect x="64" y="210" width="190" height="130" rx="14" fill="#221a10" stroke="#3a2c1a"/>
    <text x="159" y="258" fill="#f5ede3" text-anchor="middle" font-size="22" font-weight="700">dsh</text>
    <text x="159" y="290" fill="#c8b59c" text-anchor="middle" font-size="15" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">effort: "low"</text>

    <!-- right node -->
    <rect x="946" y="210" width="190" height="130" rx="14" fill="#221a10" stroke="#3a2c1a"/>
    <text x="1041" y="258" fill="#f5ede3" text-anchor="middle" font-size="22" font-weight="700">Ollama</text>
    <text x="1041" y="290" fill="#c8b59c" text-anchor="middle" font-size="15" font-weight="500">local model</text>
  </g>

  <!-- default route: dropped -->
  <path d="M254 238 L940 238" stroke="#6b5a48" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#bad)"/>
  <rect x="380" y="216" width="440" height="44" rx="10" fill="#1d150c"/>
  <text x="600" y="235" fill="#a8927a" text-anchor="middle" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/v1/chat/completions</text>
  <text x="600" y="255" fill="#f87171" text-anchor="middle" font-size="14" font-weight="600">✕ think silently dropped → full-length reasoning</text>

  <!-- native route: works -->
  <path d="M254 312 L940 312" stroke="#fbbf24" stroke-width="3" marker-end="url(#ok)"/>
  <rect x="380" y="290" width="440" height="44" rx="10" fill="#1d150c"/>
  <text x="600" y="309" fill="#fbbf24" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/api/chat   think: "low"</text>
  <text x="600" y="329" fill="#86efac" text-anchor="middle" font-size="14" font-weight="600">✓ reaches the model → reasoning you asked for</text>
</svg>
